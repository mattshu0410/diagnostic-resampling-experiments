[project]
name = "diag-cot-taxonomy"
version = "0.1.0"
description = "Cross-model taxonomy of diagnostic reasoning from chain-of-thought activations"
requires-python = ">=3.12,<3.13"

# Core = the text stages (cohort assembly, trace extraction, sentence splitting) plus config.
# Deliberately installable on aarch64/GB10, where the heavy extras are not. Anything that
# needs a GPU lives in an extra so a fresh clone can run the text pipeline and its tests
# anywhere.
dependencies = [
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",  # rollouts/store.py writes parquet parts
    "datasets>=2.19.0",  # cohort sources given as HuggingFace dataset ids
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
    "spacy>=3.7.0",
    "PyRuSH>=1.0.0",
    "loguru>=0.7.0",
    # spacy/__init__.py imports spacy.cli, which imports click. spacy does not declare click,
    # relying on typer to supply it, and typer dropped that dependency at 0.27.
    "click>=8.0",
]

[project.optional-dependencies]
# Response generation and boundary resampling with vLLM.
vllm = ["vllm>=0.6.0"]
# LLM judge: answer grouping (bucket_answers) and diagnosis grading (describe/compare).
llm = ["openai>=1.40.0", "pydantic>=2.9.0"]
# Replacement-similarity embeddings, when DCTAX_EMBED_MODEL names a sentence-transformers
# id rather than an OpenAI one. The default backend is OpenAI and needs only [llm].
embed = ["sentence-transformers>=3.0.0"]
# The scripts and notebooks under analysis/. CPU only; this is all a reader needs to
# reproduce the figures and tables from the published artifacts.
analysis = [
    "matplotlib>=3.8.0",
    "statsmodels>=0.14.0",
    "scipy>=1.13.0",
]
dev = ["pytest>=8.0.0"]

[project.scripts]
dctax = "dctax.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dctax"]

